# The dsh-plugin-local-infer-bundle patch: mounts the whole local-inference
# capability as ONE layer over an existing dsh profile.
#
# Row order carries no load semantics — activation is service-availability
# driven — so the seam may appear before or after the providers that fill it.

- insert:
    # Client carrier: mounts the bare package name so the client-module scan
    # keys the `dsh.client` declaration on it and loads dsh/client.js into the
    # boot graph. The scan only maps a bare package-root entry to its
    # `dsh.client` field, never a subpath, so this row makes the client half
    # reachable. The host module is a no-op.
    - id: local-infer
      name: 'dsh-plugin-local-infer'

    # Service Definition: publishes ctx.localInfer, the engine/preset/guideline
    # registries, and the orchestration entry points. Carries no store of its
    # own.
    - id: local-infer-service
      name: 'dsh-plugin-local-infer/service'

    # Service Providers: the concrete engine adapters, the NInfer VramModel,
    # the built-in presets, the built-in guidelines, and the per-OS SystemDep
    # install command data.
    - id: local-infer-providers
      name: 'dsh-plugin-local-infer/providers'

    # Consumer: the model-facing local_infer_* tools and their system-prompt
    # section.
    - id: local-infer-tool
      name: 'dsh-plugin-local-infer/tool'

    # Web UI: the parameter form, the VRAM meter, the red-warning banner, the
    # engine lifecycle controls, and the register-as-model confirmation.
    - id: local-infer-ui
      name: 'dsh-plugin-local-infer/ui'
