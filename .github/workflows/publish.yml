name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.3)'
        required: true
        type: string

# Least privilege at the workflow level; the single job grants what it needs.
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      # persist-credentials: false keeps the token out of the git config so
      # later steps cannot publish it; git-release.ts re-authenticates the
      # origin remote itself from the GITHUB_TOKEN env var.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2

      # No pnpm cache: a poisoned cache entry must not reach npm publish.
      # Node 24: trusted publishing requires the npm CLI >= 11.5.1 that
      # Node 24 bundles. Node 22 ships npm 10.x, which cannot do the OIDC
      # exchange and publishes anonymously, so the registry answers E404.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # inputs.version is user-chosen and unvalidated; pass it through an
      # environment variable so it cannot inject shell syntax into the run.
      - name: Bump versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: npx tsx scripts/release/bump-versions.ts "$RELEASE_VERSION"

      - name: Commit, tag, and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: npx tsx scripts/release/git-release.ts "$RELEASE_VERSION"

      - name: Publish to npm
        run: npm publish --provenance
